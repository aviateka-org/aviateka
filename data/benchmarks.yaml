    en: WIG wing with a widened root
  value:
    ru: У экрана качество до 26,6; рост CL до 19,5%, снижение сопротивления до 29,1%, рост качества до 66,1% против прямого крыла.
    en: In ground effect L/D up to 26.6; CL up to +19.5%, drag down to −29.1%, L/D up to +66.1% versus a straight wing.
