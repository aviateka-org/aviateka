- id: hydrofoil-opt
  title:
    ru: Оптимизация подводного крыла NACA 0009
    en: NACA 0009 hydrofoil optimisation
  value:
    ru: Качество +12,4%, масса −2,5%, скорость начала кавитации +45%; вне расчётного режима хуже исходного.
    en: L/D +12.4%, mass −2.5%, cavitation-inception speed +45%; worse than baseline off-design.
  use:
    ru: Зачем оптимизировать по нескольким режимам сразу.
    en: Why to optimise over several operating points.
