- id: openvsp-prop
  title:
    ru: Винты в OpenVSP
    en: Propellers in OpenVSP
  value:
    ru: Ошибка КПД до 6,1% (нестационарная решётка) и 3,6% (квазистационарная); 4 минуты на 4 потоках; при больших углах лопастей неточно.
    en: Efficiency error up to 6.1% (unsteady VLM) and 3.6% (quasi-steady); 4 min on 4 threads; inaccurate at high pitch.
