# Пустые ниши (window = окно, forbidden = запрещено) / gaps
gaps:
- id: racer-lap
  mark: window
  title:
    ru: Проектирование гоночного самолёта с моделью круга
    en: Racing aircraft design with a lap model
  near:
    ru: Оптимизация траекторий в AeroSandbox; студенческие проекты гоночных самолётов.
    en: Trajectory optimisation in AeroSandbox; student air-racer projects.
  why:
    ru: Все части существуют, собранного открытого инструмента нет. Свой код «Стрижа» уже занимает эту нишу.
    en: All parts exist, no assembled open tool. Strizh's own code already fills it.
  sources:
  - https://core.ac.uk/download/268734405.pdf
- id: joined-wing-nonlinear
  mark: window
  title:
    ru: Готовая проверка скачкообразной потери устойчивости сочленённого крыла
    en: Ready-made check of snap instability in joined wings
  near:
    ru: SHARPy, GXBeam.jl; исследовательские коды Cavallaro и Demasi.
    en: SHARPy, GXBeam.jl; research codes by Cavallaro and Demasi.
  why:
    ru: Нелинейные решатели есть; не хватает сборки под эту схему.
    en: Nonlinear solvers exist; only the setup for this layout is missing.
  sources:
  - https://escholarship.org/uc/item/1p85h6q2
- id: transonic-coaxial
  mark: forbidden
  title:
    ru: Соосные винты с околозвуковыми концами в быстрых методах
    en: Contra-rotating props with near-sonic tips in fast methods
  near:
    ru: XROTOR + CROTOR, OpenProp, DUST.
    en: XROTOR + CROTOR, OpenProp, DUST.
  why:
    ru: У концов лопастей возникают скачки уплотнения; быстрые методы учитывают их лишь поправками. Нужен полный расчёт или испытание.
    en: Shock waves form at the blade tips; fast methods handle them only with corrections. Full CFD or testing is needed.
  sources:
  - https://web.mit.edu/drela/Public/web/xrotor/
- id: nn-unconventional
  mark: window
  title:
    ru: Нейросетевая аэродинамика необычных схем
    en: Neural surrogates for unconventional layouts
  near:
    ru: Набор Emmi-Wing (обычные крылья); смешивание решётки и CFD (Бэйхан).
    en: Emmi-Wing dataset (conventional wings); VLM–CFD fusion (Beihang).
  why:
    ru: Смешивание обходится десятками дорогих расчётов, а не тысячами.
    en: Fusion needs tens of expensive runs, not thousands.
  sources:
  - https://arxiv.org/abs/2511.21474
  - https://hkxb.buaa.edu.cn/CN/abstract/article/1000-6893/21329
- id: scaled-model-chain
  mark: window
  title:
    ru: Открытая цепочка «подобная модель → идентификация → сверка» для сочленённого крыла
    en: Open chain 'scaled model → system ID → comparison' for joined wings
  near:
    ru: ArduPilot System ID; идентификация модели Cessna 182; модели сочленённых крыльев UVic.
    en: ArduPilot System ID; subscale Cessna 182 identification; UVic joined-wing models.
  why:
    ru: Все звенья есть по отдельности.
    en: All links exist separately.
  sources:
  - https://www.icas.org/ICAS_ARCHIVE/ICAS2022/data/papers/ICAS2022_0873_paper.pdf
- id: wig-integrated
  mark: window
  title:
    ru: 'Открытый расчёт экраноплана целиком: аэродинамика + корпус + устойчивость по высоте'
    en: 'Open whole-WIG analysis: aerodynamics + hull + height stability'
  near:
    ru: Autowing (лицензия по запросу); AVL и VSPAERO с экраном; OpenPlaning; MatLab-комплекс Вшивкова (не опубликован).
    en: Autowing (licence on request); AVL and VSPAERO with a ground plane; OpenPlaning; Vshivkov's MatLab tool (unpublished).
  why:
    ru: Все звенья есть по отдельности, открытой связки нет.
    en: All links exist separately; no open integration.
  sources:
  - https://www.lemos.uni-rostock.de/lehre/sonstiges/downloads/autowing
- id: foiling-vpp
  mark: window
  title:
    ru: Открытая программа скорости для парусников на крыльях
    en: Open velocity prediction program for foiling sailboats
  near:
    ru: Python-VPP (тяжёлые однокорпусные яхты), gvpp на MATLAB, студенческие VPP для Nacra 17 и IMOCA.
    en: Python-VPP (heavy monohulls), gvpp in MATLAB, student VPPs for Nacra 17 and IMOCA.
  why:
    ru: Каркас VPP открыт; не хватает модели крыльев и перехода в полёт.
    en: The VPP frame is open; the foil model and take-off transition are missing.
  sources:
  - https://github.com/marinlauber/Python-VPP
  - https://www.sourceforge.net/projects/gvpp
- id: cavitation-ventilation
  mark: forbidden
  title:
    ru: Развитая кавитация и вентиляция в быстрых методах
    en: Developed cavitation and ventilation in fast methods
  near:
    ru: Панельные методы дают только начало кавитации по минимуму давления; OpenFOAM для двухфазных течений.
    en: Panel methods give only cavitation inception from minimum pressure; OpenFOAM for two-phase flow.
  why:
    ru: Каверна и прорыв воздуха с поверхности — двухфазные явления; потенциальная теория их не описывает. Нужен полный расчёт или опыт.
    en: Cavities and air drawn from the surface are two-phase; potential theory cannot describe them. Full CFD or tests are needed.
  sources:
  - https://www.ensta.fr/en/accueil/actualites/how-can-performance-hydrofoils-be-improved
- id: hangglider-dynamics
  mark: window
  title:
    ru: Открытая модель полёта дельтаплана с балансирным управлением
    en: Open flight-dynamics model of a weight-shift hang glider
  near:
    ru: 'Нелинейные уравнения дельтаплана опубликованы и сверены с натурными замерами крыла (Aeronautical Journal); glidersim уже принимает перенос веса у параплана.'
    en: 'Nonlinear hang-glider equations are published and checked against full-scale wing data (Aeronautical Journal); glidersim already takes weight shift for paragliders.'
  why:
    ru: Уравнения и каркас программы есть, открытой сборки под дельтаплан нет.
    en: Equations and a code framework exist; no open build for hang gliders.
  sources:
  - https://cambridge.org/core/journals/aeronautical-journal/article/modelling-the-flight-dynamics-of-the-hang-glider/96DDBDBED3E0282E48353E453D79B17C
  - https://github.com/pfheatwole/glidersim
- id: ram-air-design-loop
  mark: window
  title:
    ru: 'Открытая связка «аэродинамика + ткань + стропы» для параплана и парафойла'
    en: "Open aero + fabric + lines loop for paragliders and parafoils"
  near:
    ru: 'OpenGlider, parabem и paraFEM по отдельности; mem4py с OpenFOAM для воздухозаборного кайта; ASKITE — готовая связка, но только для кайтов с надувной кромкой.'
    en: 'OpenGlider, parabem and paraFEM separately; mem4py with OpenFOAM for a ram-air kite; ASKITE is an assembled loop, but only for leading-edge inflatable kites.'
  why:
    ru: Все звенья есть, собранной открытой цепочки для воздухозаборного крыла нет.
    en: All links exist; no assembled open chain for a ram-air wing.
  sources:
  - https://github.com/booya-at/OpenGlider
  - https://github.com/awegroup/ASKITE
- id: canopy-inflation
  mark: forbidden
  title:
    ru: Раскрытие купола парашюта в быстрых методах
    en: Parachute canopy inflation in fast methods
  near:
    ru: 'Установившийся спуск — простые модели жёсткого купола (RocketPy); раскрытие — OpenFOAM или preCICE с моделью ткани.'
    en: 'Steady descent — simple rigid-canopy models (RocketPy); inflation — OpenFOAM or preCICE with a fabric model.'
  why:
    ru: При раскрытии купол сильно и нелинейно меняет форму, поток отрывается и закручивается. Быстрые методы этого не описывают; остаются опытные формулы или полный расчёт с тканью.
    en: During inflation the canopy deforms strongly and nonlinearly and the flow separates. Fast methods cannot describe it; only empirical formulas or full fluid-structure runs remain.
  sources:
  - https://core.ac.uk/download/237678621.pdf
- id: wingsuit
  mark: window
  title:
    ru: Открытый симулятор вингсьюта
    en: Open wingsuit simulator
  near:
    ru: Диссертации по динамике и устойчивости вингсьюта (Georgia Tech); закрытые игровые симуляторы.
    en: Theses on wingsuit dynamics and stability (Georgia Tech); closed game simulators.
  why:
    ru: Форма костюма зависит от позы пилота; открытой модели мы не нашли.
    en: Suit shape depends on the pilot's posture; we found no open model.
  sources:
  - https://repository.gatech.edu/entities/publication/c8bb2741-40f0-4851-927e-d8e92fab2f59
- id: hot-air-envelope
  mark: window
  title:
    ru: Открытый расчёт оболочки теплового аэростата и раскроя её клиньев
    en: Open shape and gore-pattern design for hot-air balloon envelopes
  near:
    ru: Опубликованные методы развёртки панелей оболочки (Брно); развёртка ткани в FreeCAD для парусов дельтапланов.
    en: Published flattening methods for envelope panels (Brno); fabric flattening in FreeCAD for hang-glider sails.
  why:
    ru: Производителей мало, а нужные программы немногочисленны и дороги; открытой мы не нашли.
    en: Makers are few and the useful tools are few and expensive; we found no open one.
  sources:
  - https://dspace5old.zcu.cz/bitstream/11025/10628/1/Kubicek.pdf
out_of_scope:
- ru: Глиссеры, катамараны и суда на воздушной подушке — только как разбег экраноплана; отдельно не искали.
  en: Planing boats, catamarans and hovercraft — only as a WIG take-off run; not searched separately.
- ru: 'Аэростаты — только шары-зонды и стратостаты: заправка, полёт, спуск. Дирижабли не искали.'
  en: 'Balloons — only sounding and stratospheric balloons: fill, flight, descent. Airships not searched.'
- ru: Ракеты — только спуск груза на парашюте (RocketPy); сами ракеты не искали.
  en: Rockets — only payload descent under a parachute (RocketPy); rockets themselves not searched.
- ru: 'Вертолёты покрыты частично: только программы винтов и вихревых частиц.'
  en: 'Helicopters are covered only partly: rotor and vortex-particle codes.'
