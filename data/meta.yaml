# Общие сведения каталога. repo — владелец/имя репозитория на GitHub
# Catalog metadata. repo is owner/name on GitHub
name:
  ru: Авиатека
  en: Aviateka
tagline:
  ru: Открытые инструменты проектирования летательных аппаратов, экранопланов и судов на подводных крыльях
  en: Open tools for designing aircraft, WIG craft and hydrofoil craft
as_of: '2026-11-26'
stale_days: 365
repo: aviateka-org/aviateka
versioning:
  ru: Номер версии MAJOR.MINOR.PATCH. MINOR растёт, когда добавляются инструменты, типы аппаратов, разделы или инструменты MCP. PATCH — исправления данных без новых разделов. MAJOR — несовместимые изменения схемы данных или имён инструментов MCP. Каждая версия записывается в журнал с датой и списком изменений.
  en: Version MAJOR.MINOR.PATCH. MINOR grows when tools, aircraft types, sections or MCP tools are added. PATCH means data fixes without new sections. MAJOR means breaking changes to the data schema or MCP tool names. Every version is logged with its date and changes.
method:
  ru: Даты — последний коммит основной ветки, снят 26.11.2026. «Жив» — изменения за последние 365 дней. Привязка к типам аппаратов и уровням точности — редакторская оценка.
  en: Dates are the last commit on the default branch, read 2026-11-26. 'Active' means changed within 365 days. Aircraft-type and fidelity tags are editorial judgement.
statuses:
  active:
    ru: жив
    en: active
  stale:
    ru: экспонат
    en: stale
  unknown:
    ru: дата не проверена
    en: date not checked
  legacy:
    ru: наследие
    en: legacy
  announced:
    ru: заявлено
    en: announced
  proprietary:
    ru: закрытая лицензия
    en: proprietary
  commercial:
    ru: коммерческий
    en: commercial
  on_request:
    ru: по запросу
    en: on request
  freeware:
    ru: бесплатно, без исходников
    en: freeware, no source
gap_marks:
  window:
    ru: окно
    en: window
  forbidden:
    ru: запрещено
    en: forbidden
pypi_published: true
license_code: MIT
license_data: CC-BY-4.0
# Счётчик и проверка в Google; пусто — выключено / visit counter and Google verification; empty means off
site:
  google_site_verification: null   # код из Search Console (метод «HTML-тег») / code from Search Console (HTML tag method)
  goatcounter: aviateka                # имя счётчика на goatcounter.com, например aviateka / counter code on goatcounter.com
