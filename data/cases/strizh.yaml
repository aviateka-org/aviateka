# Кейс / case study
id: strizh
title:
  ru: «Стриж» — гоночный самолёт с ромбовидным сочленённым крылом
  en: Strizh — a pylon racer with a joined diamond wing
summary:
  ru: 'Концепт класса Unlimited: Griffon 3000 л. с., соосные винты, кабина сзади. Расчётный круг 57,1 с, максимальная скорость 815 км/ч.'
  en: 'Unlimited-class concept: Griffon 3000 hp, contra-rotating propellers, aft cockpit. Predicted lap 57.1 s, top speed 815 km/h.'
own_tools:
  ru: 'Свои программы: модель самолёта и круга (JS), вихревая решётка, динамика по MIL-F-8785C, балочный МКЭ с линейным выпучиванием и дивергенцией, Монте-Карло; NeuralFoil, trimesh.'
  en: 'Own code: aircraft and lap model (JS), vortex lattice, MIL-F-8785C dynamics, beam FEM with linear buckling and divergence, Monte Carlo; NeuralFoil, trimesh.'
