    ru: Полный расчёт течения (CFD)
    en: High-fidelity CFD
- id: propulsion
  name:
    ru: Винты и тяга
    en: Propellers & propulsion
- id: stability
  name:
    ru: Устойчивость и управляемость
    en: Stability & control
- id: flightsim
  name:
    ru: Моделирование полёта
    en: Flight simulation
- id: sysid
  name:
    ru: Испытания и идентификация
    en: Flight test & system ID
- id: structures
  name:
    ru: Конструкция и масса
    en: Structures & weights
- id: aeroelastic
  name:
    ru: Аэроупругость и флаттер
    en: Aeroelasticity & flutter
- id: mdo
  name:
    ru: Оптимизация и среды проектирования
    en: MDO & design frameworks
- id: hydro
  name:
    ru: 'Гидродинамика: корпус, крыло у поверхности, кавитация'
    en: 'Hydrodynamics: hull, near-surface foils, cavitation'
fidelity:
- id: L0
  name:
    ru: Справочные формулы
    en: Handbook & empirical
  desc:
    ru: Формулы и таблицы по статистике прошлых машин. Секунды на расчёт.
    en: Statistical formulas and tables from past aircraft. Seconds per run.
- id: L1
  name:
    ru: Потенциальные методы
    en: Potential-flow & linear
  desc:
    ru: Вихревая решётка, панели, несущая линия, линейные балки. Без вязкости или с поправками.
    en: Vortex lattice, panels, lifting line, linear beams. Inviscid or with corrections.
- id: L2
  name:
    ru: Средняя точность
    en: Mid-fidelity
  desc:
    ru: Вихревые частицы, нестационарные решётки, нелинейные балки. Минуты–часы.
    en: Vortex particles, unsteady lattices, nonlinear beams. Minutes to hours.
- id: L3
  name:
    ru: Высокая точность
    en: High-fidelity
  desc:
    ru: Уравнения Навье–Стокса (RANS), оболочечный МКЭ. Часы–сутки и кластер.
    en: Navier–Stokes (RANS), shell FEM. Hours to days, often a cluster.
- id: EXP
  name:
    ru: Опыт
    en: Measured
  desc:
    ru: Аэродинамическая труба, лётные испытания, идентификация по записям.
    en: Wind tunnel, flight test, identification from logs.
