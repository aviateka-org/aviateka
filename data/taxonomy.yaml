# Справочники: дисциплины, уровни точности, этапы, типы аппаратов
# Lookups: disciplines, fidelity levels, stages, aircraft types
disciplines:
- id: geometry
  name:
    ru: Геометрия и CAD
    en: Geometry & CAD
- id: airfoil
  name:
    ru: Профили
    en: Airfoils
- id: aero
  name:
    ru: Аэродинамика аппарата
    en: Aircraft aerodynamics
- id: cfd
