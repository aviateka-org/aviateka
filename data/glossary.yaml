# Термины RU/EN / glossary
- id: vlm
  term:
    ru: Вихревая решётка
    en: Vortex lattice method (VLM)
  definition:
    ru: Крыло заменяют сеткой вихрей и считают подъёмную силу без вязкости.
    en: The wing is replaced by a grid of vortices; lift is computed without viscosity.
  search:
    zh: 涡格法
    ja: 渦格子法
- id: panel
  term:
    ru: Панельный метод
    en: Panel method
  definition:
    ru: Поверхность разбивают на панели с источниками и дуплетами; учитывает толщину.
    en: The surface is split into source/doublet panels; captures thickness.
  search:
    zh: 面元法
    ja: パネル法
- id: lifting-line
  term:
    ru: Несущая линия
    en: Lifting line
  definition:
    ru: Крыло как одна вихревая линия; быстро, для прямых крыльев большого удлинения.
    en: The wing as a single vortex line; fast, for straight high-aspect wings.
  search: {}
- id: reynolds
  term:
    ru: Число Рейнольдса
    en: Reynolds number
  definition:
    ru: Скорость × хорда / вязкость. Ниже 100 тыс. профили работают заметно хуже.
    en: Speed × chord / viscosity. Below about 100k airfoils lose much performance.
  search: {}
- id: mach
  term:
    ru: Число Маха
    en: Mach number
  definition:
    ru: Скорость / скорость звука. С 0,3–0,5 начинает сказываться сжимаемость.
    en: Speed / speed of sound. Compressibility matters from about 0.3–0.5.
  search: {}
- id: neutral-point
  term:
    ru: Нейтральная точка
    en: Neutral point
  definition:
    ru: Точка, относительно которой момент тангажа не меняется с углом атаки.
    en: The point about which pitching moment does not change with angle of attack.
  search: {}
- id: static-margin
  term:
    ru: Запас устойчивости
    en: Static margin
  definition:
    ru: Расстояние от центра тяжести до нейтральной точки в долях средней хорды.
    en: Distance from CG to neutral point as a fraction of mean chord.
  search: {}
- id: short-period
  term:
    ru: Короткопериодическое движение
    en: Short-period mode
  definition:
    ru: Быстрое качание носа по тангажу, секунды и доли секунды.
    en: Fast pitch oscillation, a second or less.
  search: {}
- id: phugoid
  term:
    ru: Фугоида
    en: Phugoid
  definition:
    ru: Медленное «нырянье» с обменом высоты на скорость.
    en: Slow exchange of height and speed.
  search: {}
- id: dutch-roll
  term:
    ru: Голландский шаг
    en: Dutch roll
  definition:
    ru: Вилянье хвостом с покачиванием крыльев.
    en: Coupled yaw–roll wagging.
  search: {}
- id: flutter
  term:
    ru: Флаттер
    en: Flutter
  definition:
    ru: Самовозбуждающиеся колебания конструкции в потоке; разрушают за секунды.
    en: Self-excited structural oscillation in airflow; destroys in seconds.
  search:
    zh: 颤振
    ja: フラッター
- id: divergence
  term:
    ru: Дивергенция
    en: Divergence
  definition:
    ru: Закручивание крыла потоком до разрушения без колебаний.
    en: The wing twists under air load until failure, without oscillation.
  search: {}
- id: buckling
  term:
    ru: Выпучивание
    en: Buckling
  definition:
    ru: Потеря устойчивости сжатого элемента; у сочленённых крыльев — заднего крыла.
    en: Loss of stability of a compressed member; for joined wings, the rear wing.
  search: {}
- id: joined-wing
  term:
    ru: Сочленённое крыло
    en: Joined wing
  definition:
    ru: Переднее и заднее крылья соединены концами в ромб.
    en: Front and rear wings joined at the tips into a diamond.
  search:
    zh: 联翼 / 连翼布局
    ja: 結合翼
- id: aeroelasticity
  term:
    ru: Аэроупругость
    en: Aeroelasticity
  definition:
    ru: Взаимное влияние упругих деформаций и аэродинамических сил.
    en: Interaction of elastic deformation and air loads.
  search:
    zh: 气动弹性
    ja: 空力弾性
- id: cubic-loading
  term:
    ru: Кубическая нагрузка на крыло
    en: Cubic wing loading
  definition:
    ru: Вес / площадь в степени 1,5 (унции и квадратные футы); сравнивает модели разного размера.
    en: Weight / area^1.5 (oz and ft²); compares models of different size.
  search: {}
- id: froude
  term:
    ru: Подобие по Фруду
    en: Froude scaling
  definition:
    ru: 'Модель повторяет движения оригинала: скорость /√k, время /√k, масса /k³, инерция /k⁵.'
    en: 'The model repeats full-size motion: speed /√k, time /√k, mass /k³, inertia /k⁵.'
  search: {}
- id: sysid
  term:
    ru: Идентификация по полёту
    en: System identification
  definition:
    ru: Восстановление производных по записи отклика на заданные отклонения рулей.
    en: Recovering derivatives from the logged response to control inputs.
  search:
    zh: 系统辨识
    ja: システム同定
- id: rans
  term:
    ru: RANS
    en: RANS
  definition:
    ru: Осреднённые уравнения Навье–Стокса с моделью турбулентности; основа промышленного CFD.
    en: Averaged Navier–Stokes equations with a turbulence model; the industrial CFD workhorse.
  search: {}
- id: mdo
  term:
    ru: Многодисциплинарная оптимизация
    en: Multidisciplinary design optimisation (MDO)
  definition:
    ru: Оптимизация, в которой аэродинамика, конструкция и прочее считаются вместе.
    en: Optimisation with aerodynamics, structures and more computed together.
  search: {}
- id: contra-rotating
  term:
    ru: Соосные винты противоположного вращения
    en: Contra-rotating propellers
  definition:
    ru: Два винта на одной оси вращаются навстречу; гасят закрутку струи и реактивный момент.
    en: Two coaxial propellers spinning opposite ways; cancel swirl and torque.
  search:
    zh: 对转螺旋桨
    ja: 二重反転プロペラ
- id: conceptual-design
  term:
    ru: Концептуальное проектирование
    en: Conceptual design
  definition:
    ru: 'Первый этап: выбор схемы и основных размеров.'
    en: 'The first stage: choosing layout and main dimensions.'
  search:
    zh: 飞机总体设计
    ja: 概念設計
- id: ground-effect
  term:
    ru: Экранный эффект
    en: Ground effect
  definition:
    ru: Рост подъёмной силы и падение индуктивного сопротивления у земли или воды, заметные примерно с высоты половины размаха.
    en: Lift rises and induced drag falls near ground or water, noticeably from about half a span.
  search:
    zh: 地面效应 / 地效飞行器
    ja: 地面効果
- id: height-ac
  term:
    ru: Фокус по высоте и критерий Иродова
    en: Height aerodynamic centre and Irodov's criterion
  definition:
    ru: У экрана сила зависит и от угла атаки, и от высоты, поэтому фокусов два. Для устойчивости фокус по высоте должен лежать впереди фокуса по углу атаки.
    en: Near the ground force depends on both angle and height, so there are two centres. For stability the height centre must lie ahead of the pitch centre.
  search: {}
- id: hump
  term:
    ru: «Горб» сопротивления
    en: Resistance hump
  definition:
    ru: Пик сопротивления на разбеге перед выходом корпуса на глиссирование или на крылья; задаёт нужную тягу.
    en: The drag peak during the take-off run before planing or foil flight; sets the thrust needed.
  search: {}
- id: planing
  term:
    ru: Глиссирование
    en: Planing
  definition:
    ru: Режим, когда корпус поддерживается в основном динамическим давлением воды, а не плавучестью.
    en: The hull is carried mainly by dynamic water pressure rather than buoyancy.
  search: {}
- id: porpoising
  term:
    ru: Дельфинирование
    en: Porpoising
  definition:
    ru: Самовозбуждающиеся колебания глиссирующего корпуса по тангажу и вертикали.
    en: Self-excited pitch–heave oscillation of a planing hull.
  search: {}
- id: cavitation
  term:
    ru: Кавитация и число кавитации
    en: Cavitation and cavitation number
  definition:
    ru: Вскипание воды там, где давление падает до давления пара. Начинается, когда число кавитации σ меньше −Cp min профиля.
    en: Water boils where pressure drops to vapour pressure. Starts when the cavitation number σ falls below the section's −Cp min.
  search:
    zh: 空化
    ja: キャビテーション
- id: ventilation
  term:
    ru: Вентиляция крыла
    en: Foil ventilation
  definition:
    ru: Прорыв воздуха с поверхности на разрежённую сторону крыла; подъёмная сила резко падает.
    en: Air drawn from the surface onto the suction side; lift collapses.
  search: {}
- id: foil-types
  term:
    ru: Пересекающие поверхность и полностью погружённые крылья
    en: Surface-piercing vs fully submerged foils
  definition:
    ru: Первые сами держат высоту за счёт смоченной площади; вторым нужен автомат высоты хода.
    en: The former self-regulate height through wetted area; the latter need ride-height control.
  search:
    zh: 水翼船
    ja: 水中翼船
- id: hydro-divergence
  term:
    ru: Гидроупругая дивергенция
    en: Hydroelastic divergence
  definition:
    ru: 'У подводных крыльев обычно раньше флаттера наступает именно дивергенция: вода в ~800 раз плотнее воздуха.'
    en: 'For hydrofoils divergence usually comes before flutter: water is ~800 times denser than air.'
  search: {}
- id: ram-air
  term:
    ru: Воздухозаборное крыло (парафойл)
    en: Ram-air wing (parafoil)
  definition:
    ru: Двухоболочковое тканевое крыло, которое держит форму за счёт набегающего воздуха, входящего в ячейки через передние отверстия.
    en: A double-skin fabric wing that holds its shape with air rammed into the cells through front openings.
  search:
    zh: 翼伞
    ja: パラフォイル
- id: ballooning
  term:
    ru: Баллонирование ячеек
    en: Cell ballooning
  definition:
    ru: Выпучивание ткани между нервюрами под давлением; меняет профиль, поэтому выкройку делают с припуском.
    en: The fabric bulges between ribs under pressure; it changes the section, so patterns carry extra width.
  search: {}
- id: calage
  term:
    ru: Калаж
    en: Calage
  definition:
    ru: Положение точки подвеса пилота относительно хорды купола; задаёт угол атаки и скорость параплана.
    en: Where the pilot hangs relative to the canopy chord; it sets the paraglider's angle of attack and speed.
  search: {}
- id: apparent-mass
  term:
    ru: Присоединённая масса
    en: Apparent mass
  definition:
    ru: Воздух, который купол разгоняет вместе с собой; у лёгких объёмных крыльев вроде парафойла заметно меняет динамику.
    en: The air a canopy accelerates with it; for light, bulky wings such as parafoils it noticeably changes the dynamics.
  search: {}
- id: weight-shift
  term:
    ru: Балансирное управление
    en: Weight-shift control
  definition:
    ru: Пилот смещает центр масс относительно крыла; так управляют дельтапланом и отчасти парапланом.
    en: The pilot moves the centre of gravity relative to the wing; hang gliders and partly paragliders are flown this way.
  search: {}
- id: gore
  term:
    ru: Клин купола
    en: Gore
  definition:
    ru: Одна из одинаковых выкроек, из которых сшит купол парашюта или оболочка аэростата.
    en: One of the identical panels sewn together into a parachute canopy or balloon envelope.
  search: {}
- id: lei-kite
  term:
    ru: Кайт с надувной передней кромкой
    en: Leading-edge inflatable (LEI) kite
  definition:
    ru: Однооболочковый кайт, форму которому дают надувная передняя кромка и распорки; под ней поток отрывается, поэтому невязких методов мало.
    en: A single-skin kite shaped by an inflated leading edge and struts; the flow separates under it, so inviscid methods are not enough.
  search: {}
- id: burst-altitude
  term:
    ru: Высота разрыва
    en: Burst altitude
  definition:
    ru: Высота, на которой оболочка шара-зонда растягивается до предела и лопается; дальше груз спускается на парашюте.
    en: The height at which a sounding balloon stretches to its limit and bursts; the payload then descends under a parachute.
  search: {}
- id: step
  term:
    ru: Редан
    en: Step
  definition:
    ru: Уступ на днище лодки или поплавка; за ним вода отрывается от днища, и сопротивление на глиссировании падает.
    en: A break in the bottom of a hull or float; the water separates behind it and planing drag drops.
  search: {}
- id: autorotation
  term:
    ru: Авторотация
    en: Autorotation
  definition:
    ru: Вращение несущего винта набегающим потоком без двигателя. У автожира это обычный полёт, у вертолёта — посадка при отказе двигателя.
    en: The rotor turned by the oncoming air without engine power. Normal flight for an autogyro, an engine-out landing for a helicopter.
  search: {}
- id: vortex-ring
  term:
    ru: Вихревое кольцо
    en: Vortex ring state
  definition:
    ru: Режим при быстром снижении почти без поступательной скорости, когда винт попадает в собственный след; тяга падает и скачет.
    en: In a fast descent with little forward speed the rotor sinks into its own wake; thrust drops and fluctuates.
  search: {}
- id: ground-resonance
  term:
    ru: Земной резонанс
    en: Ground resonance
  definition:
    ru: Раскачка вертолёта на земле, когда колебания лопастей в плоскости вращения совпадают с качанием фюзеляжа на шасси; может разрушить машину за секунды.
    en: A helicopter shaking itself apart on the ground when in-plane blade motion couples with the fuselage rocking on its gear.
  search: {}
- id: ballonet
  term:
    ru: Баллонет
    en: Ballonet
  definition:
    ru: Мешок с воздухом внутри газовой оболочки дирижабля. Его надувают или стравливают, чтобы держать давление и форму оболочки, когда газ расширяется или сжимается с высотой.
    en: An air bag inside an airship's gas envelope. It is inflated or vented to keep the envelope's pressure and shape as the gas expands or contracts with altitude.
  search: {}
- id: free-lift
  term:
    ru: Свободная подъёмная сила
    en: Free lift
  definition:
    ru: Подъём газа за вычетом веса оболочки, конструкции и груза; от неё зависит, с какой скоростью аэростат пойдёт вверх.
    en: Gas lift minus the weight of envelope, structure and load; it sets how fast the balloon climbs.
  search: {}
- id: wave-drag
  term:
    ru: Волновое сопротивление
    en: Wave drag
  definition:
    ru: Сопротивление от ударных волн на сверхзвуке. Его снижают по правилу площадей — площадь поперечных сечений вдоль аппарата должна меняться плавно.
    en: Drag from shock waves at supersonic speed. It is reduced by the area rule — the cross-section area along the vehicle should change smoothly.
  search: {}
- id: ablation
  term:
    ru: Абляция (унос)
    en: Ablation
  definition:
    ru: Теплозащита при входе в атмосферу обгорает и уносится потоком, забирая с собой тепло.
    en: The heatshield burns away during entry and is carried off by the flow, taking heat with it.
  search: {}
- id: knudsen
  term:
    ru: Число Кнудсена
    en: Knudsen number
  definition:
    ru: Длина свободного пробега молекул, делённая на размер аппарата. Когда оно велико, газ уже не сплошная среда и нужен метод частиц (DSMC).
    en: Molecular mean free path divided by vehicle size. When it is large the gas is no longer a continuum and a particle method (DSMC) is needed.
  search: {}
- id: stability-margin-calibres
  term:
    ru: Запас устойчивости в калибрах
    en: Stability margin in calibres
  definition:
    ru: Расстояние от центра тяжести ракеты назад до центра давления, делённое на диаметр корпуса.
    en: The distance from the rocket's centre of gravity back to its centre of pressure, divided by the body diameter.
  search: {}
- id: specific-impulse
  term:
    ru: Удельный импульс
    en: Specific impulse
  definition:
    ru: Тяга, делённая на расход топлива; показывает, насколько экономно двигатель тратит топливо.
    en: Thrust divided by propellant flow; shows how economically an engine uses its propellant.
  search: {}
- id: skirt
  term:
    ru: Гибкое ограждение (юбка)
    en: Skirt
  definition:
    ru: Гибкая оболочка по краю судна на воздушной подушке; удерживает воздух под днищем и даёт пройти над волнами и неровностями.
    en: The flexible fringe around a hovercraft; it holds the air under the hull and lets the craft pass over waves and bumps.
  search: {}
