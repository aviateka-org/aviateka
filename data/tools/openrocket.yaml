  ru: 'Проектирование и полёт модельных и любительских ракет: компоновка, центр тяжести и центр давления на лету, полёт с шестью степенями свободы, ступени, оптимизация.'
  en: 'Design and flight of model and amateur rockets: layout, live centre of gravity and centre of pressure, six-degree-of-freedom flight, staging, optimisation.'
