  en: 'The first tool for a rocket: stability margin, apogee, rail-exit speed.'
caveat:
  ru: Сами разработчики просят помощи со сверхзвуком — его поддержка ограничена.
  en: The developers themselves ask for help with supersonic flight — its support is limited.
