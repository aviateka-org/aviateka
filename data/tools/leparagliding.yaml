summary:
  ru: 'Программа lep Пере Касельяса строит параплан или парашют-крыло (двухоболочковый и однооболочковый): геометрию, стропы, калаж, выкройки в DXF; lepg — её графическая оболочка.'
  en: 'Pere Casellas''s lep builds a paraglider or gliding parachute (double or single skin): geometry, lines, calage and DXF patterns; lepg is its graphical front end.'
use:
  ru: 'Полный цикл любительского проектирования: от формы до раскроя; изменение калажа при работе акселератора и триммеров.'
  en: The full amateur design cycle from planform to patterns; calage change with speed bar and trimmers.
caveat:
  ru: 'Условия лицензии самого lep мы не проверили: страница автора не открылась. lepg распространяется по GPL-3.0 и включает сборки lep 3.27. Для равновесия нужны поляры из XFLR5 или CFD.'
  en: 'We did not verify the licence of lep itself: the author''s page could not be opened. lepg is GPL-3.0 and bundles lep 3.27 builds. Equilibrium needs polars from XFLR5 or CFD.'
