summary:
  ru: 'Расчёт поведения пористых теплозащитных материалов при нагреве: пиролиз, унос (абляция), прогрев по толщине. Модуль OpenFOAM, свойства газа — Mutation++.'
  en: 'Material response of porous thermal protection under heating: pyrolysis, ablation, in-depth heating. An OpenFOAM module with gas properties from Mutation++.'
