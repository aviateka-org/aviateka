summary:
  ru: 'Нелинейный нестационарный метод дискретных вихрей для аэро- и гидродинамики быстроходных аппаратов: экранопланы, подводные крылья, глиссирующие и реданные корпуса; разбег, отрыв и полёт с динамикой движения. Корень метода — работы Корнева и Трешкова (1992), версия 2.4 — 1998 год.'
  en: 'Nonlinear unsteady vortex-lattice aero- and hydrodynamics of high-speed craft: WIG, hydrofoils, planing and stepped hulls; take-off run, lift-off and flight with motion simulation. Method dates back to Kornev & Treshkov (1992); version 2.4 dates from 1998.'
use:
  ru: Единственная найденная распространяемая программа, которая считает экраноплан вместе с корпусом на воде. Годится для сравнения компоновок и поиска опасных режимов взлёта.
  en: The only distributable code found that models a WIG craft together with its hull on the water. Good for comparing layouts and finding dangerous take-off regimes.
caveat:
  ru: Программа, учебник (Tutorial), справка (Help), описание математических моделей и пример экраноплана скачиваются со страницы кафедры свободно; условия лицензии там не указаны — за ними к Корневу. Версий и дат на странице нет. Разбег до глиссирования опирается на буксировочные испытания, вязкость — на эмпирику. Независимая сверка (Ombor, 2023, высота 0,11 хорды) показала завышение подъёмной силы на 21–26 % и занижение сопротивления примерно вдвое. Судя по публикациям кафедры, экранопланами там активно занимались в 1997–2014 годах (последняя статья — 2019); код, скорее всего, раздаётся как есть. Вход в динамику экраноплана — бесплатный учебник автора Lectures on ship manoeuvrability (2013).
  en: The program, a tutorial, a help file, a description of the mathematical models and a sample WIG craft can be downloaded freely from the chair's page; licence terms are not stated there — ask Kornev. No versions or dates on the page. The pre-planing run relies on towing-tank data, viscosity on empirical formulas. An independent check (Ombor, 2023, h/c 0.11) found lift over-predicted by 21–26 % and drag under-predicted by about half. Judging by the chair's publications, active WIG work ran 1997–2014 (last paper 2019); the code is most likely distributed as is. Entry point to WIG dynamics is the author's free textbook Lectures on ship manoeuvrability (2013).
