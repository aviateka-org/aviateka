summary:
  ru: Аэродинамика и полёт ракет от модельных до исследовательских, в том числе на сверхзвуке; бесплатная, но с закрытым кодом.
  en: Aerodynamics and flight of rockets from model to sounding rockets, including supersonic; free of charge but closed source.
use:
