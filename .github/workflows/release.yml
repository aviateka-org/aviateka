# Автовыпуск: как только номер версии на main новый (его ещё нет на PyPI), сам выходит пакет на PyPI,
# запись в каталоге MCP и релиз на GitHub с меткой vX.Y.Z (его подхватывает Zenodo и выдаёт DOI).
# Метку руками ставить не нужно. Если версия не менялась, всё кроме первой короткой проверки пропускается.
# Auto-release: whenever the version on main is new (not on PyPI yet), the workflow publishes the PyPI package,
# the MCP Registry entry and a GitHub release tagged vX.Y.Z (Zenodo picks it up and mints a DOI). No manual tag needed.
#
# Разовая настройка / one-time setup:
#   1. PyPI → Publishing → «доверенный издатель» / trusted publisher:
#      репозиторий / repo aviateka-org/aviateka, workflow release.yml, environment pypi.
#   2. GitHub → Settings → Environments → «pypi»: без ограничения веток или с веткой main.
#      «pypi» environment: no branch restriction, or allow main.
#   3. Zenodo → GitHub → включить репозиторий / enable the repository (по желанию / optional).
name: Выпуск / Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Новая ли версия / Is the version new
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test -n "$v" || { echo "Нет версии в pyproject.toml / no version in pyproject.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/aviateka-mcp/$v/json")
          case "$code" in
            200) echo "release=false" >> "$GITHUB_OUTPUT"; echo "Версия $v уже на PyPI, выпуск не нужен / $v already on PyPI";;
            404) echo "release=true" >> "$GITHUB_OUTPUT"; echo "Новая версия $v, выпускаю / new version $v, releasing";;
            *) echo "PyPI ответил $code, повторите позже / PyPI answered $code, retry later"; exit 1;;
          esac

  build:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema build "mcp>=1.2"
      - name: Версии сходятся во всех файлах / Versions agree in all files
        env:
          V: ${{ needs.decide.outputs.version }}
        run: |
          python scripts/build_catalog.py --check
          python scripts/build_catalog.py
          v=$(python -c "import json;print(json.load(open('aviateka_mcp/catalog.json'))['version'])")
          test "$v" = "$V" || { echo "Версия каталога $v не совпадает с pyproject.toml $V / catalog and pyproject versions differ"; exit 1; }
      - run: python tests/test_mcp.py
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Скачать и проверить mcp-publisher / Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    needs: [decide, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      V: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Заметки из журнала / Notes from the changelog
        run: awk -v v="$V" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.decide.outputs.version }}
          name: v${{ needs.decide.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
